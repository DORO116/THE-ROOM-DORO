<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>THE ROOM</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="fondo"></div>
    <div class="parpadeo"></div>
    <div class="lluvia" id="lluvia"></div>
    <audio id="sonido" loop preload="auto">

        <!-- BUSCAR SONIDO DE LLUVIA: -->
        <source src="" type="audio/mpeg">
    </audio>

    <button id="btnSonido" class="btn-sonido"> Sonido: Apagado</button>

    <main class="pantalla-inicio">
        <h1>THE ROOM</h1>

        <p class="descripcion">
            Despiertas en una habitación. No sabes cómo llegaste aquí.<br>
            La puerta está abierta.
        </p>

        <a href="escena1.html" class="boton" id="btnComenzar">Comenzar</a>
    </main>

    <script>
        const sonido = document.getElementById('sonido');
        const btnSonido = document.getElementById('btnSonido');
        sonido.volume = 0.35;
        let sonando = false;

        function prenderSonido() {
            if (!sonando) {
                sonido.play().then(() => {
                    sonando = true;
                    btnSonido.textContent = '🔊 Sonido: Encendido';
                    document.querySelector('.tip').style.display = 'none';
                }).catch(() => {});
            }
        }

        document.addEventListener('click', prenderSonido, { once: false });

        btnSonido.addEventListener('click', (e) => {
            e.stopPropagation();
            if (sonando) {
                sonido.pause();
                sonando = false;
                btnSonido.textContent = '🔇 Sonido: Apagado';
            } else {
                prenderSonido();
            }
        });
        const lluvia = document.getElementById('lluvia');
        for (let i = 0; i < 90; i++) {
            const gota = document.createElement('span');
            gota.style.left = Math.random() * 100 + 'vw';
            gota.style.animationDuration = (Math.random() * 0.6 + 0.5) + 's';
            gota.style.animationDelay = Math.random() * 2 + 's';
            gota.style.opacity = Math.random() * 0.5 + 0.2;
            lluvia.appendChild(gota);
        }
        
body.escena3 {
    background-image: url('.png');
    background-size: cover;
    background-position: center;
}
body.jardin {
    background-image: url('jardin.png');
    background-size: cover;
    background-position: center;
}
    </script>
</body>
</html>
