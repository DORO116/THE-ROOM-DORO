<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>THE ROOM - Escena 3</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="escena escena3">

    <div class="transicion" id="transicion"></div>
    <div class="lluvia" id="lluvia"></div>

    <audio id="sonido" loop>
        <source src="lluvia.mp3" type="audio/mpeg">
    </audio>

    <header class="encabezado">
        <p id="texto"></p>
    </header>

    <div class="botones-decision" id="botones">
        <a href="pasillo.html" class="boton transicion-link">Volver al pasillo</a>
        <a href="escena4.html" class="boton transicion-link">Subir las escaleras</a>
    </div>

    <script>
        const textoCompleto = "Llegas al segundo piso. El pasillo está en silencio y unas escaleras suben hacia la oscuridad...";
        const elementoTexto = document.getElementById('texto');
        const botones = document.getElementById('botones');
        let i = 0;

        function escribir() {
            if (i < textoCompleto.length) {
                elementoTexto.textContent += textoCompleto[i];
                i++;
                setTimeout(escribir, 35);
            } else {
                botones.classList.add('mostrar');
            }
        }
        escribir();

        // LLUVIA
        const lluvia = document.getElementById('lluvia');
        for (let j = 0; j < 80; j++) {
            const gota = document.createElement('span');
            gota.style.left = Math.random() * 100 + 'vw';
            gota.style.animationDuration = (Math.random() * 0.5 + 0.5) + 's';
            gota.style.animationDelay = Math.random() * 2 + 's';
            lluvia.appendChild(gota);
        }
    </script>
</body>
</html>
