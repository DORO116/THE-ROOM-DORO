<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>THE ROOM - Pasillo</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="escena pasillo-fondo">

    <div class="transicion" id="transicion"></div>
    <div class="lluvia" id="lluvia"></div>

    <audio id="sonido" loop>

        <source src="lluvia.mp3" type="audio/mpeg">
    </audio>

    <header class="encabezado">
        <p id="texto"></p>
    </header>

    <div class="botones-decision" id="botones">
        <a href="escena1.html" class="boton transicion-link">Regresar al cuarto</a>
        <a href="escena3.html" class="boton transicion-link">Avanzar por el pasillo</a>
    </div>

    <script>
        const textoCompleto = "Abres la puerta. El pasillo está oscuro y frío. Se escuchan pasos... pero no son tuyos. Alguien más está despierto en esta casa.";
        const elementoTexto = document.getElementById('texto');
        const botones = document.getElementById('botones');
        let i = 0;
        function escribir() {
            if (i < textoCompleto.length) {
                elementoTexto.textContent += textoCompleto[i];
                i++;
                setTimeout(escribir, 35);
            } else {
                botones.classList.add('mostrar');
            }
        }
        escribir();

        const lluvia = document.getElementById('lluvia');
        for (let j = 0; j < 90; j++) {
            const gota = document.createElement('span');
            gota.style.left = Math.random() * 100 + 'vw';
            gota.style.animationDuration = (Math.random() * 0.6 + 0.5) + 's';
            gota.style.animationDelay = Math.random() * 2 + 's';
            lluvia.appendChild(gota);
        }

        const sonido = document.getElementById('sonido');
        sonido.volume = 0.35;
        sonido.play().catch(() => {
            document.addEventListener('click', () => sonido.play(), { once: true });
        });

        document.querySelectorAll('.transicion-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const destino = link.getAttribute('href');
                document.getElementById('transicion').classList.add('cerrar');
                setTimeout(() => { window.location.href = destino; }, 800);
            });
        });
    </script>
</body>
</html>
